[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/joeleaver/beardictate"
rust-version = "1.90"

[workspace.dependencies]
bd-core = { path = "crates/bd-core" }
bd-commands = { path = "crates/bd-commands" }
bd-cleanup = { path = "crates/bd-cleanup" }
bd-asr = { path = "crates/bd-asr" }
bd-audio = { path = "crates/bd-audio" }
bd-models = { path = "crates/bd-models" }
bd-platform = { path = "crates/bd-platform" }
bd-pipeline = { path = "crates/bd-pipeline" }
bd-vocab = { path = "crates/bd-vocab" }

thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
sha2 = "0.11"
hex = "0.4"
directories = "6"
ureq = { version = "3", features = ["json"] }
tempfile = "3"
cpal = "0.18"
rubato = "5"
# Shared, not static: statically linked onnxruntime shares C++ template
# instances (std::regex) with llama.cpp, built by a different GCC, and
# crashes on load when both are in one binary.
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
llama-cpp-2 = "0.1.159"
arboard = "3"
windows-sys = "0.61"
notify-rust = "4"

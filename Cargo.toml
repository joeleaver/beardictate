[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.22"
edition = "2024"
license = "MIT"
repository = "https://github.com/joeleaver/beardictate"
rust-version = "1.90"

[workspace.dependencies]
bd-core = { path = "crates/bd-core" }
bd-commands = { path = "crates/bd-commands" }
bd-cleanup = { path = "crates/bd-cleanup" }
bd-asr = { path = "crates/bd-asr" }
bd-audio = { path = "crates/bd-audio" }
bd-models = { path = "crates/bd-models" }
bd-platform = { path = "crates/bd-platform" }
bd-pipeline = { path = "crates/bd-pipeline" }
bd-vocab = { path = "crates/bd-vocab" }

thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
sha2 = "0.11"
hex = "0.4"
directories = "6"
ureq = { version = "3", features = ["json"] }
tempfile = "3"
cpal = "0.18"
rubato = "5"
# Shared, not static: statically linked onnxruntime shares C++ template
# instances (std::regex) with llama.cpp, built by a different GCC, and
# crashes on load when both are in one binary.
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
llama-cpp-2 = "0.1.159"
arboard = "3"
windows-sys = "0.61"
# The UI toolkit, pinned to a main commit with global hotkeys (rinch#1530)
# tray runtime updates (rinch#1527, #1531), notifications (rinch#1535), a
# stable Linux tray title (rinch#1537), cross-thread writes that always
# wake the window (rinch#1542), scrolling fixed (rinch#1543) and windows
# that keep their size and place across hide/show, which the app can read
# and set (rinch#1546), and window levels shown on every workspace
# (rinch#1549), and overlays as Wayland layer-shell surfaces (rinch#1523),
# with their drag kept steady and transparent windows composited with alpha
# (rinch#1597), on wgpu 30, Vello 0.11 and winit 0.31 with no patches of
# ours (rinch#1960, #1965; main 57bc511d).
rinch = { git = "https://github.com/joeleaver/rinch", rev = "57bc511d", default-features = false }

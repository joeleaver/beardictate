[package]
name = "bd-app"
description = "beardictate: the tray app (rinch)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "beardictate"
path = "src/main.rs"

[features]
default = []
# GPU cleanup through llama.cpp's Vulkan backend.
vulkan = ["bd-cleanup/vulkan"]
# The same, with llama.cpp's backends as DLLs loaded at run time, falling
# back to the CPU when Vulkan is missing (the Windows release).
vulkan-dl = ["bd-cleanup/vulkan-dl"]
# Native PipeWire capture on Linux.
pipewire = ["bd-audio/pipewire"]
# Nemotron with hotwords: only with our sherpa-onnx build (scripts/
# build-sherpa-onnx.sh, via SHERPA_ONNX_LIB_DIR). The stock library exits
# the process when asked for it.
nemotron-hotwords = ["bd-asr/nemotron-hotwords"]
# Alpha builds: record diagnostics, text and audio and send them to the
# telemetry server (docs/telemetry.md). Release builds send nothing.
alpha = ["dep:ureq", "dep:flate2", "dep:flacenc", "dep:sysinfo", "dep:getrandom"]
# rinch-debug: lets the rinch MCP server inspect and drive the window
# (RINCH_DEBUG=0 turns it off). Development only.
debug = ["rinch/debug"]

[dependencies]
bd-core.workspace = true
bd-commands.workspace = true
bd-cleanup.workspace = true
bd-asr.workspace = true
bd-audio.workspace = true
bd-models.workspace = true
bd-pipeline.workspace = true
bd-platform.workspace = true
bd-vocab.workspace = true
anyhow.workspace = true
hound.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
flacenc = { version = "0.5", optional = true }
sysinfo = { version = "0.39", optional = true, default-features = false, features = ["system"] }
getrandom = { version = "0.3", optional = true }
# No `file-dialogs`: with `system-tray` it panics on Linux (rinch#1526).
rinch = { workspace = true, features = ["desktop", "components", "theme", "system-tray", "global-hotkeys", "notifications", "gpu"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
] }

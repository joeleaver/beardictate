[package]
name = "bd-platform"
description = "beardictate: per-OS text injection (type and paste strategies)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bd-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Clipboard for the paste strategy. `wayland-data-control` lets a background
# process own the Wayland clipboard (KWin, wlroots; GNOME falls back to X11).
arboard = { workspace = true, features = ["wayland-data-control"] }
# X11: XTest fake input + core keyboard-mapping requests. Pure Rust, no libxcb.
x11rb = { version = "0.14.0", features = ["xtest"] }
# Wayland: RemoteDesktop portal (permission + restore token) and libei.
# `screencast` only because ashpd 0.13 fails to build `remote_desktop` without it.
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
reis = "0.7.1"
# Reverse-maps characters to keycodes through the keymap libei hands us.
xkbcommon = { version = "0.9.0", default-features = false, features = ["wayland"] }
pollster = "0.4.0"
rustix = { version = "1.1.2", features = ["event", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Only for the ignored live libei test, which asks a *nested* KWin for an EIS
# socket directly instead of going through the portal dialog.
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

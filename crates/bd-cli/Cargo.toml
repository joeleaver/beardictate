[package]
name = "bd-cli"
description = "beardictate: headless pipeline CLI (wav/mic -> ASR -> commands -> cleanup -> stdout), eval runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bd"
path = "src/main.rs"

[features]
# GPU cleanup through llama.cpp's Vulkan backend.
vulkan = ["bd-cleanup/vulkan"]
# Native PipeWire capture on Linux (otherwise ALSA, which reaches PipeWire
# through its plugin).
pipewire = ["bd-audio/pipewire"]

[dependencies]
bd-core.workspace = true
bd-commands.workspace = true
bd-cleanup.workspace = true
bd-asr.workspace = true
bd-audio.workspace = true
bd-models.workspace = true
bd-pipeline.workspace = true
bd-vocab.workspace = true
bd-platform.workspace = true
anyhow.workspace = true
clap.workspace = true
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true

[package]
name = "bd-audio"
description = "beardictate: microphone capture, resampling to 16 kHz mono, pre-roll ring buffer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bd-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
cpal.workspace = true
rubato.workspace = true
crossbeam-channel.workspace = true
rtrb = "0.3.2"

[features]
# Native PipeWire / PulseAudio hosts on Linux (cpal otherwise uses ALSA,
# which reaches PipeWire through its ALSA plugin). Need the system dev libs.
pipewire = ["cpal/pipewire"]
pulseaudio = ["cpal/pulseaudio"]

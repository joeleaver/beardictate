[package]
name = "bd-cleanup"
description = "beardictate: cleanup-model backends (llama.cpp in-process, OpenAI-compatible HTTP) and the word-diff guardrail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bd-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ureq.workspace = true
llama-cpp-2 = { workspace = true, optional = true }

[dev-dependencies]
bd-commands.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["llama"]
llama = ["dep:llama-cpp-2"]
vulkan = ["llama", "llama-cpp-2/vulkan"]
# Vulkan and the CPU code as llama.cpp backend DLLs (GGML_BACKEND_DL), loaded
# from the executable's folder at run time, so a machine without a Vulkan
# driver or GPU runs cleanup on the CPU instead of failing to start.
vulkan-dl = ["vulkan", "llama-cpp-2/dynamic-backends"]

# --- Cleanup ---------------------------------------------------------------
#
# One model for now (Joe, 2026-10-15): Qwen3.5-4B with the short-v1 prompt,
# the best stock model in the October 2026 survey (51% exact, 64% quotes ok
# on 171 cases, vs Qwen3-4B's 33% / 49%, at about the same latency). The
# Qwen3 entries and the Bear placeholders were removed until a small or much
# faster model earns a place. Unsloth's ungated, Apache-2.0 GGUF repo; hash
# from the HF tree API `lfs.oid` at the pinned commit. Qwen3.5 is a hybrid
# thinking model; cleanup runs it with thinking off. Sampling is greedy: the
# task is copy-with-edits, not generation.

# Pinned commit e87f176479d0855a907a41277aca2f8ee7a09523 (2026-03-02).
[[model]]
id = "cleanup-qwen3.5-4b-q4_k_m"
kind = "cleanup"
name = "Qwen3.5 4B"
license = "Apache-2.0"
homepage = "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF"
sources = [
    "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/",
]
files = [
    { path = "Qwen3.5-4B-Q4_K_M.gguf", size = 2740937888, sha256 = "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4" },
]
[model.cleanup]
prompt_template = "short-v1"
thinking = false
[model.cleanup.sampling]
temperature = 0.0
top_k = 0
top_p = 1.0
min_p = 0.0
repeat_penalty = 1.0
presence_penalty = 0.0
max_tokens = 512

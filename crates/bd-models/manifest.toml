# --- Cleanup ---------------------------------------------------------------
#
# Bear Gemma 4 E2B v4, recommended (Joe, 2026-10-16): beardictate's own
# LoRA fine-tune of Gemma 4 E2B-it, merged and quantized to Q4_0 with Q8_0
# token embeddings (ggml-org's layout), trained on the bare-tag prompt
# bear-tags-v1 with the special words. On the 171 cases: 54% exact, 81%
# quotes ok, 78% breaks ok, words changed in 1, narration quoted in 1 of 30;
# fixes 15/20 hand-written and 23/37 real misheard names (one false swap
# each), which the guardrail allows only where the heard span sounds like
# the name (bd_cleanup::respell). ~0.7 s median on the 890M.
# Report: eval/research/2026-10-bear-finetune.md. Hosted on Joe's Hugging
# Face account; hash from the HF API `x-linked-etag` (sha256), matching the
# local file.
#
# From the October 2026 survey (171 cases plus 30 narration-only cases,
# Radeon 890M), Joe 2026-10-15:
# - Qwen3.5-4B with short-v2, recommended: 50% exact, 59% quotes ok, words
#   changed in 12 cases, and quotes added to narration in 1 of 30
#   (short-v1: 51% / 64% / 16, but 11 of 30). ~1.5 s median.
# - Gemma 4 E2B with short-turns-v2 (short-v2 plus worked examples): 49%
#   exact, 72% quotes ok (the best dialog recall), words changed in 21
#   cases, narration quoted in 5 of 30. About 40% faster. (narration-turns-v1
#   was 47% / 71% / 36 / 4; short-v2 alone quotes no narration but drops to
#   31% / 47%.)
# The Qwen3 entries and the Bear placeholders were removed until a small or
# much faster model earns a place. Both repos are ungated and Apache-2.0;
# hashes from the HF tree API `lfs.oid` at the pinned commits. Thinking stays
# off. Sampling is greedy: the task is copy-with-edits, not generation.

# Pinned commit 30469fd61b69140acbed455a96491a3f168443ad (2026-10-16).
[[model]]
id = "cleanup-bear-gemma-4-e2b-v4-q4_0"

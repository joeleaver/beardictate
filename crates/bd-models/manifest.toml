name = "Bear Gemma 4 E2B"
license = "Apache-2.0"
homepage = "https://huggingface.co/joeleaver/bear-gemma-4-e2b-GGUF"
recommended = true
sources = [
    "https://huggingface.co/joeleaver/bear-gemma-4-e2b-GGUF/resolve/30469fd61b69140acbed455a96491a3f168443ad/",

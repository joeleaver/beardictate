# beardictate model manifest, compiled into the app with include_str!.
#
# Every model the app can download or import. The installer ships no weights.
#
# Rules (enforced by `Manifest::validate`, run in a unit test):
# - `id` is unique, lowercase [a-z0-9._-]. It names the model's directory in
#   the store, so give a model new bytes a new id.
# - Each `sources` entry is an https base URL ending in '/'. A file's URL is
#   the base plus the file's `path`. Sources are tried in order.
# - Sources are pinned: Hugging Face `resolve/<commit sha>/` URLs or GitHub
#   release assets, never `main`. The sha256 is the real guarantee; the pin
#   keeps it from going stale.
# - `available = false` marks a catalog entry with no weights yet: no files,
#   no sources.
# - `cleanup` models carry their prompt-template id and sampling params, so
#   swapping models never means retuning by hand.
#
# Provenance of each hash is noted per model.

# --- ASR -------------------------------------------------------------------

# k2-fsa's sherpa-onnx int8 export of nvidia/parakeet-tdt-0.6b-v3.
# Pinned commit 2bda32ec70b097a55adaa07d9a7173915b43cc78 (2025-08-16).
# Hashes: the three .onnx files from the HF tree API `lfs.oid` (sha256);
# tokens.txt is not in LFS, so it was fetched at the pinned commit and hashed
# locally, and its git blob id matched the API's `oid`
# (fc43e1c723e262df60b70e1919614417162d1fe2).
[[model]]
id = "asr-parakeet-tdt-0.6b-v3-int8"
kind = "asr"
name = "Parakeet TDT 0.6B v3 (int8)"
license = "CC-BY-4.0"
attribution = "Parakeet TDT 0.6B v3 by NVIDIA, CC-BY-4.0; ONNX export by k2-fsa/sherpa-onnx."
homepage = "https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3"
required = true
sources = [
    "https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/2bda32ec70b097a55adaa07d9a7173915b43cc78/",
]
files = [
    { path = "encoder.int8.onnx", size = 652184281, sha256 = "acfc2b4456377e15d04f0243af540b7fe7c992f8d898d751cf134c3a55fd2247" },
    { path = "decoder.int8.onnx", size = 11845275, sha256 = "179e50c43d1a9de79c8a24149a2f9bac6eb5981823f2a2ed88d655b24248db4e" },
    { path = "joiner.int8.onnx", size = 6355277, sha256 = "3164c13fc2821009440d20fcb5fdc78bff28b4db2f8d0f0b329101719c0948b3" },
    { path = "tokens.txt", size = 93939, sha256 = "d58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d" },
]


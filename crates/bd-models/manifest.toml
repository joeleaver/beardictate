# --- Cleanup ---------------------------------------------------------------
#
# From the October 2026 survey (171 cases, Radeon 890M), Joe 2026-10-15:
# - Qwen3.5-4B with short-v1, recommended: 51% exact, 64% quotes ok,
#   ~1.5 s median.
# - Gemma 4 E2B with short-turns-v1: 47% exact, 71% quotes ok, ~0.85 s
#   median, but it quotes narration that reads like speech ("Why had he come
#   back?" and the sentence after it), which the eval doesn't measure; it was
#   recommended briefly and taken back the same day. Its prompt is now
#   narration-turns-v1, which tells it most dictation is narration; in spot
#   checks on unseen sentences that stopped the false quotes and kept the
#   tagged and untagged dialog. Full eval pending.
# (Qwen3-4B, the old default, scored 33% / 49%.) The Qwen3 entries and the
# Bear placeholders were removed until a small or much faster model earns a
# place. Both repos are ungated and Apache-2.0; hashes from the HF tree API
# `lfs.oid` at the pinned commits. Thinking stays off. Sampling is greedy:
# the task is copy-with-edits, not generation.

# Pinned commit e87f176479d0855a907a41277aca2f8ee7a09523 (2026-03-02).
[[model]]
id = "cleanup-qwen3.5-4b-q4_k_m"
kind = "cleanup"
name = "Qwen3.5 4B"
license = "Apache-2.0"
homepage = "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF"
recommended = true
sources = [
    "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/",
]
files = [
    { path = "Qwen3.5-4B-Q4_K_M.gguf", size = 2740937888, sha256 = "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4" },
]
[model.cleanup]
prompt_template = "short-v1"
thinking = false
[model.cleanup.sampling]
temperature = 0.0
top_k = 0
top_p = 1.0
min_p = 0.0
repeat_penalty = 1.0
presence_penalty = 0.0
max_tokens = 512

